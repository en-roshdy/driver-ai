name: final_delivery_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.5.0

  # Functional Programming
  dartz: ^0.10.1

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.3.1
  
  # Model Generation
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Firebase
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  firebase_crashlytics: ^4.2.5
  firebase_analytics: ^11.3.5
  firebase_auth: ^5.4.1

  # Maps
  google_maps_flutter: ^2.10.0
  
  # Utilities
  socket_io_client: ^3.1.2
  lottie: ^3.1.3
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  go_router: ^14.7.2
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  
  # Code Generation
  build_runner: ^2.4.14
  injectable_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
     - assets/images/
     - assets/icons/
     - assets/fonts/

  fonts:
     - family: CustomFont
       fonts:
         - asset: assets/fonts/font.ttf
